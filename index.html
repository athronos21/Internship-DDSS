<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Kaziniya Drug Store" />
    <meta property="og:description" content="DDS (Digital Drug Store) platform featuring Step 1 System Registration & Gateway, Step 2 Role-Based Pharmacy Store Workstation (POS, FEFO Inventory, Rx Verification), and Step 3 Financial Close Z-Reports & Master Fleet Audit." />
    <title>Digital Drug Store</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent benign Vite HMR websocket connection errors from surfacing as app unhandled rejection banners
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = String((reason && (reason.message || reason)) || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('[vite]') !== -1 ||
          msg.indexOf('closed without opened') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = String((event && event.message) || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('[vite]') !== -1 ||
          msg.indexOf('closed without opened') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
