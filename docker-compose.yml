services:
  # ========================================================
  # PostgreSQL Database Container
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: kaziniya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kaziniya_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kaziniya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Web Database Management UI (Adminer)
  # Accessible at: http://localhost:8080
  # ========================================================
  adminer:
    image: adminer:latest
    container_name: kaziniya-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
